<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AQLYVEN Admin Login</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#080b14;color:#fff;font-family:Arial,sans-serif}
.box{width:min(92%,390px);background:#0d1120;border:1px solid #252d45;border-radius:20px;padding:32px;box-shadow:0 20px 60px #0008}
.logo{text-align:center;font-size:25px;font-weight:800;margin-bottom:8px}
.sub{text-align:center;color:#7f89a5;font-size:13px;margin-bottom:28px}
label{display:block;color:#aeb6ce;font-size:13px;margin:0 0 8px}
input{width:100%;padding:14px;border-radius:10px;border:1px solid #29314a;background:#080b14;color:#fff;outline:none;margin-bottom:16px}
button{width:100%;padding:14px;border:0;border-radius:10px;background:#fff;color:#080b14;font-weight:700;cursor:pointer}
#msg{min-height:20px;text-align:center;color:#ff7777;font-size:13px;margin-top:14px}
</style>
</head>
<body>
<div class="box">
  <div class="logo">⚡ AQLYVEN</div>
  <div class="sub">ADMIN CONTROL CENTER</div>

  <form id="loginForm">
    <label>Admin password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
  </form>

  <div id="msg"></div>
</div>

<script>
document.getElementById("loginForm").onsubmit = async e => {
  e.preventDefault();
  document.getElementById("msg").textContent = "Connecting...";
};
</script>
</body>
</html>
